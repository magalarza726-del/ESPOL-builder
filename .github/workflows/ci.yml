name: Verify ESPOL Builder branches
on:
  push:
    branches-ignore: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify runtime and architecture
        run: npm run verify
